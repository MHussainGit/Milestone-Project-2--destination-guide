<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse popular holiday destinations and explore local attractions.">
    <title>Popular Destinations - Destination Guide</title>

    <!-- Preconnects (DNS & TCP warmup) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin> <!-- Added for Bootstrap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Render-blocking CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Non-blocking CSS & fonts (Preload trick) -->
    <!-- Custom Styles -->
    <link rel="preload" href="assets/css/styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="assets/css/styles.css"></noscript>

    <!-- Google Fonts Optimized -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"></noscript>

    <link rel="icon" type="image/webp" href="assets/favicon/travel.webp">

    <!-- CLS prevention style -->
    <style>
        #destList { min-height: 80vh; display: flex; align-items: flex-start; }
        #skip-link { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
        #skip-link:focus { position: static; width: auto; height: auto; }
    </style>
</head>

<body>
    <a href="#main-content" class="btn btn-light" id="skip-link">Skip to main content</a>
    
    <header class="text-white">
        <nav class="navbar navbar-expand-lg navbar-dark container" aria-label="Main navigation">
            <a class="navbar-brand" href="index.html">Destination Guide</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="destinations.html" aria-current="page">Popular Destinations</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container py-5 mt-5" id="main-content">
        <div class="mb-5 text-center text-dark pt-3">
            <h1 id="destinations-heading" class="fw-bold">Popular Holiday Destinations</h1>
            <p class="lead text-muted mx-auto" style="max-width: 700px;">Browse our curated selection of popular destinations or click any destination to search for attractions, restaurants, and more.</p>
        </div>

        <div class="row g-4" id="destList" role="region" aria-label="Destination cards grid">
             <!-- JS content will inject here -->
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Destination Guide. All rights reserved.</p>
        </div>
    </footer>

    <!-- Optimized script loading -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</body>
</html>
