<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags for search engines -->
    <meta name="description"
        content="Destination Guide: search your next holiday destination and explore attractions, accommodations, and restaurants.">
    <meta name="keywords" content="holiday, travel, destinations, attractions, hotels, historic sites, vacation">
    <title>Destination Guide</title>
    <link rel="icon" sizes="180x180" type="image/png" href="assets/favicon/travel.webp">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Google Fonts & Bootstrap retained -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous">
</head>

<body>
    <!-- Skip to main content link for keyboard navigation -->
    <a href="#main-content" class="btn btn-primary position-absolute" style="top: -40px; left: 0; z-index: 10000;" id="skip-link">Skip to main content</a>
    
    <!-- Header -->
    <header class="bg-primary text-white">
        <nav class="navbar navbar-expand-lg navbar-dark container" aria-label="Main navigation">
            <a class="navbar-brand" href="index.html">Destination Guide</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html"> Popular Destinations</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main content -->
    <main class="container-fluid p-0" id="main-content">
        <section id="hero">
            <div id="cover-text">
                <h1>Welcome to Destination Guide</h1>
                <h2>Search your next holiday destination to explore attractions, accommodation and historic sites</h2>
                <!-- Search Form -->
                <form id="searchForm" autocomplete="off" aria-label="Destination search form">
                    <div id="search-input-wrapper">
                        <label for="cityInput">Search a City or Country</label>
                        <div id="search-controls">
                            <input list="citySuggestions" type="text" class="form-control" id="cityInput" placeholder="Search a City/Country" aria-label="City or country name" aria-describedby="search-help">
                            <button type="submit" class="btn btn-primary" aria-label="Search for destination">Search</button>
                        </div>
                        <small id="search-help" class="form-text">Type a city name and press Enter or click Search</small>
                        <datalist id="citySuggestions">
                            <!-- Suggestions populated by JS -->
                        </datalist>
                    </div>
                </form>
            </div>
        </section>
        <div id="results" aria-live="polite" aria-atomic="true"></div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            &copy; 2026 Destination Guide. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap JS bundle and app -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    
    <!-- Make skip link visible on focus -->
    <script>
        const skipLink = document.getElementById('skip-link');
        if (skipLink) {
            skipLink.addEventListener('focus', function() {
                this.style.top = '0';
            });
            skipLink.addEventListener('blur', function() {
                this.style.top = '-40px';
            });
        }
    </script>
    
    <script src="assets/js/app.js"></script>
</body>

</html>
